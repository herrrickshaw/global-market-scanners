# Shared health workflow, rolled out across the herrrickshaw repos on 2026-10-26.
# install -> import every module offline -> pytest -> ruff bug gate -> pip-audit (report only).
# The import step is .github/scripts/import_all.py; it never runs top-level script bodies
# and blocks the network. Python matrix: 3.10-3.14.
name: Health

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install pytest
      - name: Import every module (offline)
        run: python .github/scripts/import_all.py
      - name: Tests
        run: python -m pytest -q -p no:cacheprovider

  lint:
    name: ruff + pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install "ruff>=0.17,<1" pip-audit
      - name: ruff gate (syntax, undefined names, pylint errors)
        run: ruff check . --select E9,F63,F7,F82,PLE --extend-exclude '*.ipynb' --extend-exclude 'from-working-files'
      - name: ruff bug-rule report (annotations only)
        run: |
          ruff check . --select F,B,PLE,PLW,NPY,PD,RUF,DTZ,ASYNC --extend-exclude '*.ipynb' --extend-exclude 'from-working-files' --output-format github --exit-zero
          { echo '### ruff bug-rule hits'; echo '```'; ruff check . --select F,B,PLE,PLW,NPY,PD,RUF,DTZ,ASYNC --extend-exclude '*.ipynb' --extend-exclude 'from-working-files' --statistics --exit-zero; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: pip-audit (report only until the known CVE bumps land)
        continue-on-error: true
        run: |
          status=0
          pip-audit --desc on --format markdown -o audit.md || status=$?
          { echo '### pip-audit'; cat audit.md; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
