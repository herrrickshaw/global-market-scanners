# Rolled out across the herrrickshaw repos on 2026-10-26. Monthly, one grouped PR per ecosystem.
# Security updates for known CVEs are a repo setting (Settings > Code security), not this file.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
