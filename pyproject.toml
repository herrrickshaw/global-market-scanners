[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["graphify-out", "notebooks", "node_modules"]

[tool.ruff.lint]
# Phase 1 gate: real defects only (undefined names, syntax). Style rules are enabled
# module-by-module in Phase 2 once the legacy scanners are decomposed.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
